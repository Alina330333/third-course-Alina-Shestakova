<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лаба 7. Преобразования</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Геометрические преобразования (2D)</h1>

  <div class="controls">
    <fieldset>
      <legend>Параметры</legend>
      <label>tx: <input type="number" id="tx" value="5"></label>
      <label>ty: <input type="number" id="ty" value="5"></label>
      <br>
      <label>sx: <input type="number" id="sx" value="1"></label>
      <label>sy: <input type="number" id="sy" value="1"></label>
      <br>
      <label>Угол (град): <input type="number" id="angle" value="45"></label>
      <br>
      <label>Центр cx: <input type="number" id="cx" value="10"></label>
      <label>Центр cy: <input type="number" id="cy" value="10"></label>
    </fieldset>

    <fieldset>
      <legend>Порядок операций</legend>
      <label><input type="radio" name="order" value="TR" checked> Сначала поворот, потом перенос (T * R)</label><br>
      <label><input type="radio" name="order" value="RT"> Сначала перенос, потом поворот (R * T)</label>
    </fieldset>
  </div>

  <div class="controls">
    <button id="applyBtn">Применить</button>
    <button id="resetBtn">Сброс</button>
  </div>

  <canvas id="canvas" width="600" height="450"></canvas>

  <div class="tables">
    <div>
      <h2>Матрица 3x3</h2>
      <table id="matrixTable">
        <tr><td>0</td><td>0</td><td>0</td></tr>
        <tr><td>0</td><td>0</td><td>0</td></tr>
        <tr><td>0</td><td>0</td><td>1</td></tr>
      </table>
    </div>
    <div>
      <h2>Координаты вершин</h2>
      <table>
        <thead>
          <tr>
            <th>Вершина</th>
            <th>x исх.</th>
            <th>y исх.</th>
            <th>x новый</th>
            <th>y новый</th>
          </tr>
        </thead>
        <tbody id="pointsBody"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
