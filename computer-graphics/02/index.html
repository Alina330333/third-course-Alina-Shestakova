<!DOCTYPE html>

<html lang="ru">
<!-- Корневой тег всей страницы.
     lang="ru" — подсказка для поисковиков и скринридеров: содержимое на русском. -->

<head>
<!-- head — служебная часть. Пользователь её не видит, но браузер читает:
     кодировку, заголовок вкладки, подключённые стили и скрипты. -->

  <meta charset="UTF-8">
  <!-- Кодировка UTF-8.  -->

  <title>Лаба 2. Брезенхем</title>
  <!-- Текст, который отображается на вкладке браузера. -->

  <link rel="stylesheet" href="style.css">
  <!-- Подключаем внешний файл стилей. Он лежит в той же папке, поэтому путь просто «style.css». -->
</head>

<body>
<!-- Всё, что видно на странице, находится внутри body. -->

  <h1>Алгоритмы построения отрезка</h1>
  <!-- Заголовок первого уровня — крупный жирный текст. -->

  <!-- БЛОК УПРАВЛЕНИЯ
       Здесь пользователь вводит координаты, выбирает алгоритм и жмёт «Построить». -->
  <div class="controls">

    <label>X1: <input type="number" id="x1" value="2"></label>
    <!-- label связывает подпись «X1:» с полем ввода — удобно кликать.
         type="number" — браузер сам не даст вводить буквы.
         id="x1" нужен, чтобы найти это поле из JS через document.querySelector('#x1').
         value="2" — значение по умолчанию, чтобы сразу было что построить. -->

    <label>Y1: <input type="number" id="y1" value="2"></label>
    <!-- координата Y начала отрезка -->

    <label>X2: <input type="number" id="x2" value="20"></label>
    <!-- координата X конца отрезка -->

    <label>Y2: <input type="number" id="y2" value="8"></label>
    <!-- координата Y конца отрезка -->

    <label>
      Алгоритм:
      <select id="algo">
        <!-- select — выпадающий список. Пользователь выбирает один из вариантов.
             id="algo" нужен, чтобы прочитать выбранное значение в JS. -->

        <option value="dda">ЦДА</option>
        <!-- если выбрать этот пункт, value будет строкой "dda" -->

        <option value="bresenham" selected>Брезенхем</option>
        <!-- selected — этот пункт выбран по умолчанию при загрузке страницы.
             value будет строкой "bresenham" -->
      </select>
    </label>

    <button id="buildBtn">Построить</button>
    <!-- Кнопка, по клику на которую мы строим отрезок выбранным алгоритмом. -->
  </div>

  <!-- КНОПКА БЕНЧМАРКА
       Отдельный блок — потому что это отдельная задача:
       не построить одну линию, а сравнить скорость двух алгоритмов. -->
  <div class="controls">
    <button id="benchBtn">Сравнить скорость (1000 линий)</button>
  </div>

  <!-- ХОЛСТ
       width=600, height=450 — это РАЗМЕР В ЭКРАННЫХ ПИКСЕЛЯХ.
       При scale=10 получится 60×45 логических пикселей на экране.
       Нам нужно как минимум 40×30 — помещается с запасом. -->
  <canvas id="canvas" width="600" height="450"></canvas>

  <!-- ДВЕ КОЛОНКИ ПОД ХОЛСТОМ
       Слева — список выбранных пикселей.
       Справа — таблица шагов алгоритма Брезенхема.
       Позже в CSS мы разместим их рядом через flex. -->
  <div class="columns">

    <div>
      <h2>Пиксели</h2>
      <!-- Заголовок второго уровня — чуть меньше h1. -->

      <ul id="pixelsList"></ul>
      <!-- Пустой список. JS будет добавлять <li> для каждого выбранного пикселя.
           Это позволяет сравнить набор точек у ЦДА и Брезенхема. -->
    </div>

    <div>
      <h2>Таблица шагов Брезенхема</h2>

      <table>
        <thead>
          <!-- thead — шапка таблицы. Повторяется один раз, не меняется. -->
          <tr>
            <th>шаг</th>       <!-- номер итерации -->
            <th>x</th>         <!-- текущая x-координата -->
            <th>y</th>         <!-- текущая y-координата -->
            <th>error</th>     <!-- накопленная ошибка -->
            <th>error2</th>    <!-- удвоенная ошибка (2*error) -->
            <th>Δx</th>        <!-- сдвинулись ли по x на этом шаге -->
            <th>Δy</th>        <!-- сдвинулись ли по y на этом шаге -->
          </tr>
        </thead>
        <tbody id="stepsBody"></tbody>
        <!-- tbody — тело таблицы. Строки добавит JS. -->
      </table>
    </div>
  </div>

  <script src="app.js"></script>
  <!-- Подключаем скрипт В КОНЦЕ body.
       Так к моменту выполнения JS все элементы выше уже существуют в DOM.
       Если бы script был в head, document.querySelector('#canvas') вернул бы null,
       потому что canvas ещё не создан. -->
</body>
</html>
