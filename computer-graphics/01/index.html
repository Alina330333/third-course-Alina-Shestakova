<!DOCTYPE html>                                  <!-- Говорим браузеру: это HTML5-документ -->
<html lang="ru">                                 <!-- Корневой тег, язык страницы — русский -->
<head>                                           <!-- Служебный блок, невидимый пользователю -->
  <meta charset="UTF-8">                         <!-- Кодировка UTF-8, чтобы русский текст отображался правильно -->
  <title>Лабораторная 1. ЦДА</title>             <!-- Название вкладки в браузере -->
  <link rel="stylesheet" href="style.css">       <!-- Подключаем внешний файл стилей -->
</head>
<body>                                           <!-- Всё видимое содержимое страницы -->

  <h1>Алгоритм ЦДА</h1>                          <!-- Заголовок первого уровня -->

  <!-- БЛОК УПРАВЛЕНИЯ: 4 поля ввода координат и кнопка "Построить"-->
  <div class="controls">
    <label>X1: <input type="number" id="x1" value="2"></label>
    <!-- Поле для X-координаты начала отрезка. value="2" — значение по умолчанию -->

    <label>Y1: <input type="number" id="y1" value="2"></label>
    <!-- Поле для Y-координаты начала отрезка -->

    <label>X2: <input type="number" id="x2" value="20"></label>
    <!-- Поле для X-координаты конца отрезка -->

    <label>Y2: <input type="number" id="y2" value="8"></label>
    <!-- Поле для Y-координаты конца отрезка -->

    <button id="buildBtn">Построить</button>
    <!-- Кнопка, по клику на которую будет строиться отрезок -->
  </div>

  <!-- ХОЛСТ, на котором будем рисовать пиксели
       width и height задаются в ЭКРАННЫХ пикселях, а не в логических.
       При scale=10: 600/10 = 60 логических пикселей в ширину,
                     450/10 = 45 логических пикселей в высоту.
       Этого хватает для сетки 40x30 и отступов. -->
  <canvas id="canvas" width="600" height="450"></canvas>

  <!-- ТАБЛИЦА ШАГОВ АЛГОРИТМА
       Заголовок всегда одинаковый, строки будут добавляться через JS -->
  <h2>Таблица шагов</h2>
  <table id="stepsTable">
    <thead>
      <tr>
        <th>шаг</th>              <!-- Номер итерации -->
        <th>x до округления</th>  <!-- Дробное значение x -->
        <th>y до округления</th>  <!-- Дробное значение y -->
        <th>пиксель x</th>        <!-- Округлённое x (целое) -->
        <th>пиксель y</th>        <!-- Округлённое y (целое) -->
      </tr>
    </thead>
    <tbody id="stepsBody"></tbody>
    <!-- Пустое тело таблицы — строки добавит JavaScript -->
  </table>

  <script src="app.js"></script>                 <!-- Подключаем JS. Важно: в конце body -->
</body>
</html>
