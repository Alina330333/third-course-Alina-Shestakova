<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лаба 7. Мои задачи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Мои задачи</h1>

    <div id="message" class="message"></div>

    <!-- Форма создания -->
    <form id="task-form" class="task-form">
      <input type="text" id="task-title" placeholder="Название задачи" required>
      <input type="text" id="task-desc" placeholder="Описание (необязательно)">
      <button type="submit">Добавить</button>
    </form>

    <div class="controls">
      <button id="refresh-btn">Обновить список</button>
    </div>

    <!-- Список задач -->
    <ul id="task-list" class="task-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
