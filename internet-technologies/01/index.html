<!DOCTYPE html>                                  <!-- Говорим браузеру: это HTML5-документ -->
<html lang="ru">                                 <!-- Корневой тег, язык страницы — русский -->
<head>                                           <!-- Служебный блок, невидимый пользователю -->
  <meta charset="UTF-8">                         <!-- Кодировка UTF-8, чтобы русский текст отображался правильно -->
  <title>Счётчик</title>                         <!-- Название вкладки в браузере -->
  <link rel="stylesheet" href="style.css">       <!-- Подключаем внешний файл стилей -->
</head>
<body>                                           <!-- Всё видимое содержимое страницы -->

  <h1>Счётчик</h1>                               <!-- Заголовок первого уровня -->

  <p>Текущее значение: <span id="value">0</span></p>
  <!-- Абзац с текстом. Внутри span с id="value" — сюда JS будет записывать текущее число -->

  <button id="increase">+1</button>              <!-- Кнопка увеличить. id нужен, чтобы найти её в JS -->
  <button id="decrease">-1</button>              <!-- Кнопка уменьшить -->
  <button id="reset">Сброс</button>              <!-- Кнопка сбросить -->

  <p id="message">Число равно нулю</p>
  <!-- Абзац для сообщения о знаке числа. id="message" — тоже для JS -->

  <script src="app.js"></script>                 <!-- Подключаем JS. Важно: в конце body, а не в head -->
</body>
</html>
