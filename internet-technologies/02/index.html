<!DOCTYPE html>                                  <!-- Говорим браузеру: это HTML5-документ -->
<html lang="ru">                                 <!-- Корневой тег. lang="ru" — язык страницы русский -->
<head>                                           <!-- Служебная часть, невидимая пользователю -->
  <meta charset="UTF-8">                         <!-- Кодировка UTF-8, чтобы русский текст был виден правильно -->
  <title>Анализатор чисел</title>                <!-- Название вкладки в браузере -->
  <link rel="stylesheet" href="style.css">       <!-- Подключаем файл стилей из той же папки -->
</head>
<body>                                           <!-- Всё видимое содержимое страницы -->

  <h1>Анализатор чисел</h1>                      <!-- Заголовок первого уровня -->

  <!-- БЛОК УПРАВЛЕНИЯ: поле ввода и три кнопки -->
  <div class="controls">
    <input type="number" id="numberInput" placeholder="Введите число">
    <!-- type="number" — браузер сам не даст ввести буквы (но всё равно проверим в JS).
         id нужен, чтобы найти это поле из JS.
         placeholder — серая подсказка внутри поля. -->

    <button id="addBtn">Добавить</button>           <!-- Добавить число в массив -->
    <button id="removeBtn">Удалить последнее</button> <!-- Убрать последнее число -->
    <button id="clearBtn">Очистить</button>          <!-- Полностью очистить список -->
  </div>

  <!-- Место под сообщение об ошибке. Изначально пусто. -->
  <p id="error" class="error"></p>

  <!-- СПИСОК ЧИСЕЛ
       Пустой <ul>. Строки <li> добавит JavaScript через функцию render() -->
  <h2>Числа</h2>
  <ul id="numbersList"></ul>

  <!-- ТАБЛИЦА СТАТИСТИКИ
       Каждое значение имеет свой id, чтобы JS мог его обновить.
       "—" стоит как заглушка для пустого состояния. -->
  <h2>Статистика</h2>
  <table>
    <tr><td>Количество:</td><td id="count">0</td></tr>  <!-- Сколько чисел в массиве -->
    <tr><td>Сумма:</td><td id="sum">0</td></tr>          <!-- Сумма всех чисел -->
    <tr><td>Среднее:</td><td id="average">—</td></tr>    <!-- Среднее арифметическое -->
    <tr><td>Минимум:</td><td id="min">—</td></tr>        <!-- Минимальное число -->
    <tr><td>Максимум:</td><td id="max">—</td></tr>       <!-- Максимальное число -->
  </table>

  <script src="app.js"></script>                 <!-- Подключаем JS. Важно: в самом конце body -->
</body>
</html>
